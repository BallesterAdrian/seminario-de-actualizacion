        this._canvas.height = 500;
        this._canvas.style.border = '1px solid black';

        let ctx = this._canvas.getContext('2d');
        let Xc = this._canvas.width / 2;
        let Yc = this._canvas.height / 2;
        let Radio = this._canvas.width / 2;
        let Ai = 0;
        let Af = 2 * Math.PI;

        
        while(Radio > 0){
            ctx.beginPath();
            ctx.arc(Xc, Yc, Radio, Ai, Af);
            Radio = Radio - 25;
            ctx.stroke();
        }
