<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8" />
<title>Ejercicios Unidad 4</title>
<script src="MVCCanvas.js"></script>
<script src="ejercicio-6.js"></script>
</head>

<body></body>

<script>

function main() {
    let modelo = new Model();
    let wc = new View();
    let controlador = new Controller(wc, modelo);
    controlador.enable();

    var btnCargar = document.createElement('button');
    var btnLimpiar = document.createElement('button');

    btnCargar.innerText = 'Cargar Figuras';
    btnLimpiar.innerText = 'Limpiar';

    btnLimpiar.onclick = function() {
        wc.clear();
    };

    btnCargar.onclick = function() {
        let texto = prompt("Ingresa el JSON de figuras:");
        
        if (texto) {
            try {
                let figures = JSON.parse(texto);
                
                if (Array.isArray(figures)) {
                    for (var i = 0; i < figures.length; i++) {
                        modelo.addFigure(figures[i]);
                    }
                } else {
                    alert("Debe ser un arreglo, empieza con [");
                }
            } catch (error) {
                alert("JSON inválido: " + error.message);
            }
        }
    };

    document.body.appendChild(btnCargar);
    document.body.appendChild(btnLimpiar);
    document.body.appendChild(wc);
}

window.onload = main;

</script>

</html>
