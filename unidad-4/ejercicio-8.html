class Model extends EventTarget {
    constructor() {
        super();
        this.Radios = [];
        this.Texts = [];
    }
    
    addRadios(valor) {  
    this.Radios.push(parseFloat(valor));  
    }

    addTexts(texto) {  
        this.Texts.push(texto); 
    }

    getText(){
        return this.Texts;
    }
    getRadios(){
        return this.Radios;
    }


    changed() {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

class View extends HTMLElement {
    constructor() 
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 500;
        this._canvas.height = 500;
        this._canvas.style.border = '1px solid black';

        this.ctx = this._canvas.getContext('2d');
        this.inputValor = document.createElement('input');
        this.inpuText = document.createElement('input');
        this.btnGrafic = document.createElement('button');
        this.btnsiguient = document.createElement('button');
        this.Xc = this._canvas.width / 2;
        this.Yc = this._canvas.height / 2;
        this.Radio = this._canvas.width / 2;
        this.Ai = 0;
        this.Af = 2 * Math.PI;

        this.inputValor.placeholder = "Escribe el valor del angulo ej: 30";
        this.inpuText.placeholder = "Escribe el porcentaje %";
        this.btnGrafic.innerText = "Graficar torta";
        this.btnsiguient.innerText = "siguiente angulo";

        this.appendChild(this._canvas);
        this.appendChild(this.btnGrafic);
        this.appendChild(this.btnsiguient);
        this.appendChild(this.inputValor);
        this.appendChild(this.inpuText);
        
    }
    
    DrawCake(valores, textos){
        this.ctx.font = "14px Arial";
        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "middle";
        this.inicio = 0;
    
    for(let i = 0; i < valores.length; i++){
        this.fin = this.inicio + (valores[i] * this.Af);
        
        let medio = (this.inicio + this.fin) / 2;
        
        this.ctx.beginPath();
        this.ctx.moveTo(this.Xc, this.Yc);
        this.ctx.arc(this.Xc, this.Yc, this.Radio, this.inicio, this.fin);       
        this.ctx.stroke();

        let RadioText = this.Radio * 0.65;
        
        this.Xt = this.Xc + RadioText * Math.cos(medio);
        this.Yt = this.Yc + RadioText * Math.sin(medio);
        
        let Textprocentuado = (valores[i] * 100) + "%";
        let textoFinal = textos[i] ? (textos[i] + " " + Textprocentuado) : Textprocentuado;
        this.ctx.fillText(textoFinal, this.Xt, this.Yt);
        this.inicio = this.fin;
    }
    this.ctx.closePath();
}

    }
   
    get value() {
        
    }
    connectedCallback() {
       console.log('Canvas agregado...');
       this.btnGrafic.onclick = this._onFinish.bind(this);
       this.btnsiguient.onclick = this._onSave.bind(this);
        
    }
    disconnectedCallback() {
        
    }
    
    _onSave() {
       let valor = this.inputValor.value;
       let texto = this.inpuText.value;

       let evento = new CustomEvent('request', {
        detail: {
            action: "next",
            Radio: valor,
            Texts: texto
          }
       });
       this.dispatchEvent(evento);
       this.inpuText.value = "";
       this.inputValor.value = "";
    }

    _onFinish(){
       let evento = new CustomEvent('request', {
        detail: {
            action: "finish"
            }
        });
        this.dispatchEvent(evento);
    }
}
customElements.define('x-view', View);


class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }
    enable() {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);
    }
    disable() {
        this._model.removeEventListener('changed', this._onModelChanged);
        this._view.removeEventListener('request', this._onViewRequest);
    }
    onModelChanged() {
        
    }
    onViewRequest(event) {
       if(event.detail.action === "next"){
            let Radio = event.detail.Radio;
            let texto = event.detail.Texts;
            this._model.addRadios(Radio);
            this._model.addTexts(texto);
            console.log(this._model.Radios.length);
        }

        if(event.detail.action === "finish"){
            let Radio = this._model.getRadios();
            let Texto = this._model.getText();
            console.log(Radio, Texto);
            this._view.DrawCake(Radio, Texto);
        } 
    }
}

function main() {
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    document.body.appendChild(myView);
}
