class Model extends EventTarget {
    constructor() {
        super();
        this.red = 0;
        this.blue = 0;
        this.green = 0;
    }
    
    setRed(value){
        this.red = value;
        this.changed();
    }

    setBlue(value){
        this.blue = value;
        this.changed();
    }

    setGreen(value){
        this.green = value;
        this.changed();
    }

    getRed(){
        return this.red;
    }

    getBlue(){
        return this.blue;
    }

    getGreen(){
        return this.green;
    }

    getColor(){
        return 'RGB(' + this.red + ',' + this.blue + ',' + this.green + ')';
    }

    changed() {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

class View extends HTMLElement {
    constructor() 
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 256;
        this._canvas.height = 256;
        this._canvas.style.border = '1px solid black';
        this.slider1 = document.createElement('input');
        this.slider2 = document.createElement('input');
        this.slider3 = document.createElement('input');
        this.label1 = document.createElement('label');
        this.label2 = document.createElement('label');
        this.label3 = document.createElement('label');
        this.container = document.createElement('div');
        this.ctx = this._canvas.getContext('2d');
        this._currentColor = 'rgb(0, 0, 0)';
        
        this.slider1.type = 'range';
        this.slider1.min = 0;
        this.slider1.max = 255;
        this.slider1.value = 0;
        this.slider2.type = 'range';
        this.slider2.min = 0;
        this.slider2.max = 255;
        this.slider2.value = 0;
        this.slider3.type = 'range';
        this.slider3.min = 0;
        this.slider3.max = 255;
        this.slider3.value = 0;
        this.label1.textContent = 'Rojo';
        this.label2.textContent = 'Azul';
        this.label3.textContent = 'Verde';

        
        this.appendChild(this._canvas);
        this.appendChild(this.container);
        this.container.appendChild(this.label1);
        this.container.appendChild(this.slider1);
        this.container.appendChild(this.label2);
        this.container.appendChild(this.slider2);
        this.container.appendChild(this.label3);
        this.container.appendChild(this.slider3);
        this.drawBoard();
    }
    
    drawBoard(){
        let cellSize = 32;
        let rows = 8;
        let columns = 8;
        let black = this._currentColor || 'rgb(100, 100, 100)';
        let white = '#ffffff';

        this.ctx.clearRect(0, 0, this._canvas.width, this._canvas.height);

        for(let row = 0; row < rows; row++){
            for(let col = 0; col < columns; col++){
                if((row + col) % 2 !==0){
                    this.ctx.fillStyle = black;
                }
                else{
                    this.ctx.fillStyle = white;
                }
                let y = col * cellSize;
                let x = row * cellSize;
                this.ctx.fillRect(x, y, cellSize, cellSize);
            }
        }

    }

    onSlider1Change(event) {
        this.dispatchEvent(new CustomEvent('request', {
            detail: { type: 'red', value: parseInt(event.target.value) }
        }));
    }
    
    onSlider2Change(event) {
        this.dispatchEvent(new CustomEvent('request', {
            detail: { type: 'green', value: parseInt(event.target.value) }
        }));
    }
    
    onSlider3Change(event) {
        this.dispatchEvent(new CustomEvent('request', {
            detail: { type: 'blue', value: parseInt(event.target.value) }
        }));
    }

    updateColor(color) {
        this._currentColor = color;
        this.drawBoard();
    }

    connectedCallback() {
        this._boundSlider1Change = this.onSlider1Change.bind(this);
        this._boundSlider2Change = this.onSlider2Change.bind(this);
        this._boundSlider3Change = this.onSlider3Change.bind(this);
        this.slider1.addEventListener('input', this._boundSlider1Change);
        this.slider2.addEventListener('input', this._boundSlider2Change);
        this.slider3.addEventListener('input', this._boundSlider3Change);
        console.log('Canvas agregado...');
    }
    disconnectedCallback() {
        this._boundSlider1Change = null;
        this._boundSlider2Change = null;
        this._boundSlider3Change = null;
    }
    
    _onSave() {
       
    }
}
customElements.define('x-view', View);


class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }
    enable() {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);
    }
    disable() {
        this._model.removeEventListener('changed', this._onModelChanged);
        this._view.removeEventListener('request', this._onViewRequest);
    }
    onModelChanged() {
      let color = this._model.getColor();
      this._view.updateColor(color);  
    }
    onViewRequest(event) {
        let data = event.detail;
        
        if (data.type === 'red') {
            this._model.setRed(data.value);
        } else if (data.type === 'green') {
            this._model.setGreen(data.value);
        } else if (data.type === 'blue') {
            this._model.setBlue(data.value);
        }
    }
}

function main() {
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    document.body.appendChild(myView);
}
window.onload = main;
