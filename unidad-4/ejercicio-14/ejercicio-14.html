<script type="text/javascript">

class Model extends EventTarget {
    constructor() {
        super();
        this._firstColor = 'black';
        this._secondColor = 'white';
    }

    setFirstColor(color){
        this._firstColor = color;
        this.changed();
    }

    setSecondColor(color){
        this._secondColor = color;
        this.changed();
    }

    getFirstColor(){
        return this._firstColor;
    }

    getSecondColor(){
        return this._secondColor;
    }
   
    changed() {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

class View extends HTMLElement {
    constructor() 
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 800;
        this._canvas.height = 600;
        this._canvas.style.border = '1px solid black';
        this.ctx = this._canvas.getContext('2d');
        this.input1 = document.createElement('input');
        this.input2 = document.createElement('input');
        

        this.input1.placeholder = 'primer color';
        this.input1.type = 'color';
        this.input1.value = '#000000';
        this.input2.placeholder = 'segundo color';
        this.input2.type = 'color';
        this.input2.value = '#ffffff';

        

        this.appendChild(this._canvas);
        this.appendChild(this.input1);
        this.appendChild(this.input2);
    }
    
    updateGradient(Fcolor, Scolor){
        let ancho = 200;
        let alto = 400;
        let x = 0;
        let y = 0;


        this.ctx.beginPath();
        let gradiante = this.ctx.createLinearGradient(0, 0, 200, 0);
        gradiante.addColorStop(0, Fcolor);
        gradiante.addColorStop(1, Scolor);

        this.ctx.fillStyle = gradiante;
        this.ctx.rect(x, y, ancho, alto);
        this.ctx.fill();
    }

    set value(x) {
       
    }
   
    get value() {
        
    }
    connectedCallback() {
        this.boundOnFirst = this._onInputFirst.bind(this);
        this.boundOnSecond = this._onInputSecond.bind(this);
        this.input1.addEventListener('input', this.boundOnFirst);
        this.input2.addEventListener('input', this.boundOnSecond);
        console.log('Canvas agregado...');
    }
    disconnectedCallback() {
        this.boundOnFirst = null;
        this.boundOnSecond = null;
    }
    
    _onInputFirst(event){
        this._onSave('inicio', event.target.value);
    }

    _onInputSecond(event){
        this._onSave('fin', event.target.value);
    }

    _onSave(tipo, valor){
        this.dispatchEvent(new CustomEvent('request', {
            detail: {tipo: tipo, valor: valor}
        }));
    }
}
customElements.define('x-view', View);


class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }
    enable() {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);
    }
    disable() {
        this._model.removeEventListener('changed', this._onModelChanged);
        this._view.removeEventListener('request', this._onViewRequest);
    }
    onModelChanged() {
       let fcolor = this._model.getFirstColor();
       let scolor = this._model.getSecondColor();
       
       this._view.updateGradient(fcolor, scolor);
    }
    onViewRequest(event) {
        let data = event.detail;
        
        if (data.tipo === 'inicio') {
            this._model.setFirstColor(data.valor);
        } 
        else if (data.tipo === 'fin') {
            this._model.setSecondColor(data.valor);
        }
    }
}

function main() {
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    document.body.appendChild(myView);
}
window.onload = main;

</script>
