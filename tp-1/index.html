<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saludar</title>
</head>
<body>
</body>

<script>

class Saludo extends HTMLElement {
    constructor(){
        super();
        this.inputName = document.createElement('input');
        this.inputLastName = document.createElement('input');
        this.btnSaludo = document.createElement('button');
        this.contenedor = document.createElement('div');

        //tipo
        this.inputName.type = 'text';
        this.inputLastName.type = 'text';
        this.btnSaludo.innerText = 'Saludar';


        //contenedor
        this.appendChild(this.contenedor);
        this.contenedor.appendChild(this.inputName);
        this.contenedor.appendChild(this.inputLastName);
        this.appendChild(this.btnSaludo);

    }
    saludar(){
        let nombre = this.inputName.value.trim().toLowerCase();
        let primera = nombre.charAt(0).toUpperCase();
        let resto = nombre.slice(1);
        let nombrecorregido = primera + resto;
        this.contenedor.textContent = '¡Buenos días ' + this.inputLastName.value.toUpperCase() + ', ' + nombrecorregido + '!';
    }

    connectedCallback(){
        this.btnSaludo.onclick = this.saludar.bind(this);
        
    }

    disconnectedCallback(){
        this.btnSaludo.onclick = null;
    }

}

customElements.define('x-saludo', Saludo);

function main(){
    let myCustomerForm = new Saludo();
    document.body.appendChild(myCustomerForm);
}
window.onload = main;
</script>
</html>
