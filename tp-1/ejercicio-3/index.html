<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equalizer</title>
</head>
<body>   
</body>
<script>
class EqualizerView extends HTMLElement{
    constructor(){
        super();
        //sliders
        this.slider1 = document.createElement('input');
        this.slider2 = document.createElement('input');
        this.slider3 = document.createElement('input');
        this.slider4 = document.createElement('input');
        this.slider5 = document.createElement('input');
        this.slider6 = document.createElement('input');
        this.slider7 = document.createElement('input');
        this.slider8 = document.createElement('input');
        this.slider9 = document.createElement('input');
        this.slider0 = document.createElement('input');
        this.container = document.createElement('div');

        //tipo
        this.container.style.display = 'flex';

        //contenedor
        this.appendChild(this.container);
        //array de todos los sliders
        this.sliders = [
            this.slider0,
            this.slider1,
            this.slider2,
            this.slider3,
            this.slider4,
            this.slider5,
            this.slider6,
            this.slider7,
            this.slider8,
            this.slider9
        ];

        //rango del slider
        for(var index = 0; index < this.sliders.length; index++){
            var slider = this.sliders[index];
            slider.type = 'range';
            slider.min = -12;
            slider.max = 12;
            slider.value = 0;
            slider.style.writingMode = 'bt-lr';
            slider.style.height = '180px';
            slider.style.width = '150px';
            slider.style.transform = 'rotate(-90deg)';
            slider.style.background = '#555';
        }

        //data
        this.data = [
            { freq: '32Hz', value: 0 },
            { freq: '64Hz', value: 0 },
            { freq: '130Hz', value: 0},
            { freq: '260Hz', value: 0},
            { freq: '500Hz', value: 0},
            { freq: '1k', value: 0},
            { freq: '2k', value: 0},
            { freq: '4k', value: 0},
            { freq: '8.3k', value: 0},
            { freq: '16.5k', value: 0}
        ];

        for(var index = 0; index < this.sliders.length; index++){
            var slider = this.sliders[index];
            var bandContainer = document.createElement('div');
            bandContainer.style.display = 'flex';
            bandContainer.style.flexDirection = 'column';
            bandContainer.style.alignItems = 'center';

            var valueLabel = document.createElement('p');
            valueLabel.textContent = slider.value + 'dB';

            var freqLabel = document.createElement('p');
            freqLabel.textContent = this.data[index].freq;

            slider.dataset.index = index;
            slider.valueLabel = valueLabel;
            bandContainer.appendChild(freqLabel);
            bandContainer.appendChild(slider);
            bandContainer.appendChild(valueLabel);
            this.container.appendChild(bandContainer);
            //style 
            valueLabel.style.color = 'white';
            freqLabel.style.color = 'white';
            valueLabel.style.fontSize = '12px';
            freqLabel.style.fontSize = '12px';
            bandContainer.style.display = 'flex';
            bandContainer.style.flexDirection = 'column';
            bandContainer.style.alignItems = 'center';
        }

        //style del contenedor
        this.container.style.display = 'flex';
        this.container.style.gap = '11px';
        this.container.style.backgroundColor = '#1e1e1e';
        this.container.style.borderRadius = '8px';
        this.container.style.alignItems = 'flex-end';
    }

    handleSliderInput(event){
        var slider = event.target;
        var index = slider.dataset.index;
        this.data[index].value = slider.value;
        slider.valueLabel.textContent = slider.value + 'dB';
        console.log(
            this.data[index].freq + ' → ' + slider.value
        );
    }

    connectedCallback(){
        // Guardamos la referencia del manejador bindeado
        this._boundHandleSliderInput = this.handleSliderInput.bind(this);
        
        for(var index = 0; index < this.sliders.length; index++){
            this.sliders[index].addEventListener('input', this._boundHandleSliderInput);
        }
    }

    disconnectedCallback(){
        // Removemos los event listeners usando la misma referencia
        for(var index = 0; index < this.sliders.length; index++){
            this.sliders[index].removeEventListener('input', this._boundHandleSliderInput);
        }
        // Liberamos la referencia
        this._boundHandleSliderInput = null;
    }
    
    getData(){
        return this.data;
    }   

    render() {
        for(var index = 0; index < this.sliders.length; index++){
            this.sliders[index].value = this.data[index].value;
        }
    }

    setData(newData){
        this.data = newData;
        this.render();
    }
}

customElements.define('x-equalizer', EqualizerView);

function main() {
    var equalizer = new EqualizerView();
    document.body.appendChild(equalizer);
}
window.onload = main;
</script>
</html>
