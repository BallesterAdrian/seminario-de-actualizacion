<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobador de fechas</title>
</head>
<body> 
</body>

<script>
    class ValidadorDFechas extends HTMLElement{
        constructor(){
            super();
            this.input = document.createElement('input');
            this.btnvalidacion = document.createElement('button');
            this.intentos = 0;
            this.mensaje = document.createElement('div');
            this.contenedor = document.createElement('div');

            //tipo
            this.input.type = 'text';
            this.btnvalidacion.innerText = 'Validar';
            
            //mostrar
            this.appendChild(this.contenedor);
            this.appendChild(this.input);
            this.appendChild(this.btnvalidacion);
            this.contenedor.appendChild(this.mensaje);
             
        }

        ValidarFecha(){
                let valor = this.input.value;
                let partes = valor.split('/');    
                let dia = Number(partes[0]);
                let mes = Number(partes[1]);
                let anio = Number(partes[2]);
                if (
                    partes.length !== 3 ||
                    partes[0].trim() === '' ||
                    partes[1].trim() === '' ||
                    partes[2].trim() === ''
                ) {
                    this.intentos++;
                    this.mensaje.textContent = `invalido - intento ${this.intentos}`;
                    return;
                }
                
                if (isNaN(dia) || isNaN(mes) || isNaN(anio)) {
                    this.intentos++;
                    this.mensaje.textContent = `invalido - intento ${this.intentos}`;
                    return;
                }

                if (mes < 1 || mes > 12) {
                    this.intentos++;
                    this.mensaje.textContent = `mes invalido - intento ${this.intentos}`;
                    return;
                } 

                let esBisiesto = (anio % 4 === 0 && anio % 100 !== 0) || (anio % 400 === 0);
                let maxDias = 31;
                if (mes === 2) {
                    let esBisiesto = (anio % 4 === 0 && anio % 100 !== 0) || (anio % 400 === 0);
                    maxDias = esBisiesto ? 29 : 28;
                }
                else if (mes === 4 || mes === 6 || mes === 9 || mes === 11) {
                    maxDias = 30;
                }
                else {
                    maxDias = 31;
                }
                if (dia < 1 || dia > maxDias) {
                    this.intentos++;
                    this.mensaje.textContent = `invalido - intento ${this.intentos}`;
                    return;
                }
                this.mensaje.textContent = `${dia}/${mes}/${anio} es una fecha válida`;
        }

        connectedCallback(){
            this.btnvalidacion.onclick = this.ValidarFecha.bind(this);
        }

        disconnectedCallback(){
            this.btnvalidacion.onclick = null;
        }
    }

customElements.define('x-validador-de-fechas', ValidadorDFechas);

function main(){
    let myCustomerForm = new ValidadorDFechas();
    document.body.appendChild(myCustomerForm);
}
window.onload = main;
</script>
</html>
