<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura AFIP</title>
</head>
<body>   
</body>
<script>
class factura extends HTMLElement{
    constructor(){
        super();
        this.inputs = {};

        //contenedor
        this.titulo = document.createElement('h2');
        this.contenedor = document.createElement('div');
        this.inputs.razonS = document.createElement('input');
        this.inputs.Dcomercial = document.createElement('input');
        this.inputs.cuit = document.createElement('input');
        this.inputs.condiIVA = document.createElement('input');
        //cliente
        this.inputs.nameC = document.createElement('input');
        this.inputs.AddressC = document.createElement('input');
        this.inputs.condiIVAC = document.createElement('input');
        //factura
        this.inputs.Nfactura = document.createElement('input');
        this.inputs.fecha = document.createElement('input');
        this.inputs.formaPago = document.createElement('input');
        //producto
        this.inputs.producto = document.createElement('input');
        this.inputs.cantidad = document.createElement('input');
        this.inputs.PrecioXunidad = document.createElement('input');
        //boton
        this.btn = document.createElement('button');

        //type
        this.titulo.innerText = 'Formulario Factura AFIP';
        this.btn.innerText = 'Generar factura';
        this.inputs.razonS.placeholder = 'Razon';
        this.inputs.Dcomercial.placeholder = 'Domicilio comercial';
        this.inputs.cuit.placeholder = 'CUIT';
        this.inputs.condiIVA.placeholder = 'condicion de IVA';
        this.inputs.nameC.placeholder = 'Nombre del cliente';
        this.inputs.AddressC.placeholder = 'Direccion del cliente';
        this.inputs.condiIVAC.placeholder = 'Condicion del IVA del cliente';
        this.inputs.Nfactura.placeholder = 'Numero de factura';
        this.inputs.formaPago.placeholder = 'Forma de pago';
        this.inputs.producto.placeholder = 'Producto';
        this.inputs.fecha.type = 'date';
        this.inputs.cantidad.type = 'number';
        this.inputs.cantidad.placeholder = 'cantidad';
        this.inputs.PrecioXunidad.type = 'number';
        this.inputs.PrecioXunidad.placeholder = 'precio por unidad';
        //contenedor
        this.appendChild(this.contenedor);
        this.contenedor.appendChild(this.inputs.razonS);
        this.contenedor.appendChild(this.inputs.Dcomercial);
        this.contenedor.appendChild(this.inputs.cuit);
        this.contenedor.appendChild(this.inputs.condiIVA);
        this.contenedor.appendChild(this.inputs.nameC);
        this.contenedor.appendChild(this.inputs.AddressC);
        this.contenedor.appendChild(this.inputs.condiIVAC);
        this.contenedor.appendChild(this.inputs.Nfactura);
        this.contenedor.appendChild(this.inputs.formaPago);
        this.contenedor.appendChild(this.inputs.producto);
        this.contenedor.appendChild(this.inputs.fecha);
        this.contenedor.appendChild(this.inputs.cantidad);
        this.contenedor.appendChild(this.inputs.PrecioXunidad);
        this.contenedor.appendChild(this.titulo);
        this.contenedor.appendChild(this.btn);

        //style
        this.titulo.style.textAlign = 'center';
        this.titulo.style.marginBottom = '10px';
        this.contenedor.style.display = 'flex';
        this.contenedor.style.flexDirection = 'column';
        this.contenedor.style.width = '400px';
        this.contenedor.style.margin = '40px auto';
        this.contenedor.style.padding = '20px';
        this.contenedor.style.backgroundColor = 'white';
        this.contenedor.style.border = '2px solid #cfcfcf';
        this.contenedor.style.borderRadius = '10px';
        this.contenedor.style.boxShadow = '0px 0px 10px rgba(0,0,0,0.2)';
        this.contenedor.style.gap = '10px';
        this.contenedor.style.fontFamily = 'Arial';
        this.btn.style.padding = '12px';
        this.btn.style.backgroundColor = '#2d89ef';
        this.btn.style.color = 'white';
        this.btn.style.border = 'none';
        this.btn.style.borderRadius = '5px';
        this.btn.style.cursor = 'pointer';
        this.btn.style.fontSize = '16px';
        Object.values(this.inputs).forEach(input => {

            input.style.padding = '10px';
            input.style.border = '1px solid #aaa';
            input.style.borderRadius = '5px';
            input.style.fontSize = '14px';
            input.style.outline = 'none';

        });

    }
    
    formulario(){

        let razonSocial = this.inputs.razonS.value;
        let DomicilioC = this.inputs.Dcomercial.value;
        let CUIT = this.inputs.cuit.value;
        let CondicionIVA = this.inputs.condiIVA.value;
        let Nombre = this.inputs.nameC.value;
        let Direccion = this.inputs.AddressC.value;
        let CondiIVACliente = this.inputs.condiIVAC.value;
        let NumeroFactura = this.inputs.Nfactura.value;
        let FormadePago = this.inputs.formaPago.value;
        let Producto = this.inputs.producto.value;
        let CANTIDAD = this.inputs.cantidad.value;
        let Preciounidad = this.inputs.PrecioXunidad.value;
        let Total = CANTIDAD * Preciounidad;
        let porcentajeIVA = 21;
        let IVA = Total * (porcentajeIVA / 100);
        let TotalConIVA = Total + IVA;

        let data = {
            razonSocial: razonSocial,
            DomicilioC: DomicilioC,
            CUIT: CUIT,
            CondicionIVA: CondicionIVA,
            Nombre: Nombre,
            Direccion: Direccion,
            CondiIVACliente: CondiIVACliente,
            fecha: this.inputs.fecha.value,
            NumeroFactura: NumeroFactura,
            FormadePago: FormadePago,
            Producto: Producto,
            CANTIDAD: CANTIDAD,
            Preciounidad: Preciounidad,
            Total: Total
        };

        let nuevaVentana = window.open('', '_blank');

        let factura = this.GenerarFactura(data);
        nuevaVentana.document.body.appendChild(factura);

    }

 GenerarFactura(data){

    let contenedor = document.createElement('div');
    contenedor.style.fontFamily = 'Arial';
    contenedor.style.width = '900px';
    contenedor.style.margin = '20px auto';
    contenedor.style.border = '2px solid black';
    contenedor.style.backgroundColor = 'white';

    //Encabezado
    let encabezado = document.createElement('div');
    encabezado.style.display = 'flex';
    encabezado.style.borderBottom = '2px solid black';

    let empresa = document.createElement('div');
    empresa.style.width = '50%';
    empresa.style.padding = '20px';
    empresa.style.borderRight = '2px solid black';

    let razon = document.createElement('h2');
    razon.textContent = 'Razón Social: ' + data.razonSocial;

    let domicilio = document.createElement('p');
    domicilio.textContent = 'Domicilio: ' + data.DomicilioC;

    let cuit = document.createElement('p');
    cuit.textContent = 'CUIT: ' + data.CUIT;

    let condicion = document.createElement('p');
    condicion.textContent = 'Condición IVA: ' + data.CondicionIVA;

    empresa.appendChild(razon);
    empresa.appendChild(domicilio);
    empresa.appendChild(cuit);
    empresa.appendChild(condicion);

    let factura = document.createElement('div');
    factura.style.width = '50%';
    factura.style.padding = '20px';

    let numero = document.createElement('h1');
    numero.textContent = 'Factura';
    numero.style.textAlign = 'center';
    numero.style.margin = '0';
    numero.style.fontSize = '40px';

    let numeroFactura = document.createElement('p');
    numeroFactura.textContent =
        'Número de Factura: ' + data.NumeroFactura;

    let fecha = document.createElement('p');
    fecha.textContent =
        'Fecha de emisión: ' + data.fecha;

    let formaPago = document.createElement('p');
    formaPago.textContent =
        'Forma de Pago: ' + data.FormadePago;

    factura.appendChild(numero);
    factura.appendChild(numeroFactura);
    factura.appendChild(fecha);
    factura.appendChild(formaPago);

    encabezado.appendChild(empresa);
    encabezado.appendChild(factura);

    contenedor.appendChild(encabezado);
     
    //Cliente

    let cliente = document.createElement('div');
    cliente.style.padding = '20px';
    cliente.style.borderBottom = '2px solid black';

    let tituloCliente = document.createElement('h2');
    tituloCliente.textContent = 'Datos del Cliente';

    let nombre = document.createElement('p');
    nombre.textContent = 'Nombre: ' + data.Nombre;

    let direccion = document.createElement('p');
    direccion.textContent = 'Dirección: ' + data.Direccion;

    let ivaCliente = document.createElement('p');
    ivaCliente.textContent =
        'Condición IVA: ' + data.CondiIVACliente;

    cliente.appendChild(tituloCliente);
    cliente.appendChild(nombre);
    cliente.appendChild(direccion);
    cliente.appendChild(ivaCliente);

    contenedor.appendChild(cliente);
   
    //Tabla
    let tablaContenedor = document.createElement('div');
    tablaContenedor.style.padding = '20px';

    let tabla = document.createElement('table');
    tabla.style.width = '100%';
    tabla.style.borderCollapse = 'collapse';
    tabla.style.textAlign = 'center';

    let encabezadoTabla = document.createElement('tr');
    encabezadoTabla.style.backgroundColor = '#efefef';

    let thProducto = document.createElement('th');
    thProducto.textContent = 'Producto';
    thProducto.style.border = '1px solid black';
    thProducto.style.padding = '10px';

    let thCantidad = document.createElement('th');
    thCantidad.textContent = 'Cantidad';
    thCantidad.style.border = '1px solid black';
    thCantidad.style.padding = '10px';

    let thPrecio = document.createElement('th');
    thPrecio.textContent = 'Precio Unitario';
    thPrecio.style.border = '1px solid black';
    thPrecio.style.padding = '10px';

    let thSubtotal = document.createElement('th');
    thSubtotal.textContent = 'Subtotal';
    thSubtotal.style.border = '1px solid black';
    thSubtotal.style.padding = '10px';

    encabezadoTabla.appendChild(thProducto);
    encabezadoTabla.appendChild(thCantidad);
    encabezadoTabla.appendChild(thPrecio);
    encabezadoTabla.appendChild(thSubtotal);

    tabla.appendChild(encabezadoTabla);

    let fila = document.createElement('tr');

    let tdProducto = document.createElement('td');
    tdProducto.textContent = data.Producto;
    tdProducto.style.border = '1px solid black';
    tdProducto.style.padding = '10px';

    let tdCantidad = document.createElement('td');
    tdCantidad.textContent = data.CANTIDAD;
    tdCantidad.style.border = '1px solid black';
    tdCantidad.style.padding = '10px';

    let tdPrecio = document.createElement('td');
    tdPrecio.textContent = '$' + data.Preciounidad;
    tdPrecio.style.border = '1px solid black';
    tdPrecio.style.padding = '10px';

    let tdSubtotal = document.createElement('td');
    tdSubtotal.textContent = '$' + data.Total;
    tdSubtotal.style.border = '1px solid black';
    tdSubtotal.style.padding = '10px';

    fila.appendChild(tdProducto);
    fila.appendChild(tdCantidad);
    fila.appendChild(tdPrecio);
    fila.appendChild(tdSubtotal);

    tabla.appendChild(fila);

    tablaContenedor.appendChild(tabla);

    contenedor.appendChild(tablaContenedor);
    
    //Totales
    let porcentajeIVA = 21;
    let subtotal = Number(data.Total);
    let iva = subtotal * (porcentajeIVA / 100);
    let totalFinal = subtotal + iva;

    let totales = document.createElement('div');
    totales.style.padding = '20px';
    totales.style.borderTop = '2px solid black';
    totales.style.textAlign = 'right';

    let hSubtotal = document.createElement('h3');
    hSubtotal.textContent = 'Subtotal: $' + subtotal.toFixed(2);

    let hIVA = document.createElement('h3');
    hIVA.textContent = 'IVA (' + porcentajeIVA + '%): $' + iva.toFixed(2);

    let hTotal = document.createElement('h2');
    hTotal.textContent = 'Total Final: $' + totalFinal.toFixed(2);

    totales.appendChild(hSubtotal);
    totales.appendChild(hIVA);
    totales.appendChild(hTotal);

    contenedor.appendChild(totales);

    return contenedor;
}

    connectedCallback(){
         this.btn.onclick = this.formulario.bind(this);
    }

    disconnectedCallback(){
        this.btn.onclick = null;
    }

}

customElements.define('x-factura', factura);
function main() {
    let myCustomerForm = new factura();
    document.body.appendChild(myCustomerForm);
}
window.onload = main;
</script>
</html>
