<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
</head>
<body>   
</body>
<script>
class clima extends HTMLElement{
    constructor(){
        super();
        this.attachShadow({mode: 'open'});
        this.months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre', 'anual'],
        this.data = [
            { name: "Temp. máx. abs. (°C)", values: [42.4, 39.1, 36.9, 32.5, 27.4, 22.2, 27.7, 24.7, 28.8, 34.4, 35.7, 39.4, 39.4] },
            { name: "Temp. máx. media (°C)", values: [28.3, 25.8, 23.7, 20.5, 16.8, 13.8, 13.1, 14.4, 16.0, 18.5, 21.7, 24.4, 19.6] },
            { name: "Temp. media (°C)", values: [20.3, 19.9, 18.0, 14.0, 11.3, 8.5, 8.1, 8.9, 10.5, 13.1, 15.9, 18.5, 14.0] },
            { name: "Temp. mín. media (°C)", values: [14.3, 14.1, 12.5, 9.1, 6.4, 4.1, 3.8, 4.0, 5.3, 7.6, 10.1, 12.7, 8.7] },
            { name: "Temp. mín. abs. (°C)", values: [4.7, 1.2, 1.9, -1.0, -3.0, -5.5, -9.3, -6.4, -5.5, -3.0, -2.0, -0.2, -9.3] },
            { name: "Precipitación total (mm)", values: [100.1, 72.8, 107.0, 73.3, 73.5, 54.9, 58.9, 64.0, 56.4, 83.4, 75.3, 104.0, 923.6] },
            { name: "Días de precipitaciones (≥ 0.1 mm)", values: [9, 8, 9, 9, 9, 9, 9, 8, 7, 10, 10, 10, 107] },
            { name: "Horas de sol", values: [288.3, 234.5, 232.5, 195.0, 167.4, 120.0, 127.1, 164.3, 174.0, 210.8, 222.0, 269.7, 2405.6] },
            { name: "Humedad relativa (%)", values: [76, 77, 79, 81, 83, 84, 81, 81, 80, 80, 77, 76, 80] }
        ];


    }

    connectedCallback(){
       this.render(); 
    }

    render(){
         const table = document.createElement('table');
        table.style.borderCollapse = 'collapse';
        table.style.width = '100%';
        table.style.fontFamily = 'Arial, sans-serif';
        table.style.fontSize = '14px';

        // Encabezado
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        headerRow.style.backgroundColor = '#f2f2f2';
        
        const mesHeader = document.createElement('th');
        mesHeader.textContent = 'Mes';
        mesHeader.style.padding = '8px';
        mesHeader.style.textAlign = 'left';
        headerRow.appendChild(mesHeader);

        this.months.forEach(month => {
        const th = document.createElement('th');
        th.textContent = month;
        th.style.padding = '8px';
        th.style.textAlign = 'center';
        headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        // Cuerpo de la tabla
        const tbody = document.createElement('tbody');
        this.data.forEach(row => {
        const tr = document.createElement('tr');
        
        const nameCell = document.createElement('td');
        nameCell.textContent = row.name;
        nameCell.style.fontWeight = 'bold';
        nameCell.style.padding = '8px';
        nameCell.style.textAlign = 'left';
        tr.appendChild(nameCell);

        row.values.forEach(value => {
            const td = document.createElement('td');
            td.textContent = value;
            td.style.padding = '8px';
            td.style.textAlign = 'center';
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        // Fuentes
        const footer = document.createElement('div');
        footer.style.fontSize = '0.8em';
        footer.style.marginTop = '10px';
        footer.innerHTML = `
        Fuente n° 1: NOAA. Servicio Meteorológico Nacional (precipitación diaria)<sup>63</sup><br>
        Fuente n° 2: UNLP (sun only)<sup>64</sup>
        `;

        this.shadowRoot.innerHTML = '';
        this.shadowRoot.appendChild(table);
        this.shadowRoot.appendChild(footer);
         const button = document.createElement('button');
            button.textContent = 'Obtener promedios de temperaturas';
            button.style.marginTop = '15px';
            button.style.padding = '10px 20px';
            button.style.backgroundColor = '#4CAF50';
            button.style.color = 'white';
            button.style.border = 'none';
            button.style.borderRadius = '5px';
            button.style.cursor = 'pointer';
            button.style.fontWeight = 'bold';

            button.addEventListener('click', () => {
                const averages = this.getTemperaturapromedio();
                alert(`Promedios de temperaturas:\n${averages.join(', ')}`);
            });

            this.shadowRoot.appendChild(button);
    }

    getTemperaturapromedio(){
        const tempRowNames = [
             "Temp. máx. media (°C)",
            "Temp. media (°C)",
            "Temp. mín. media (°C)"
        ];

        return this.data
            .filter(row => tempRowNames.includes(row.name))
            .flatMap(row => row.values);
    }
}

customElements.define('x-clima', clima);
function main() {
    let myCustomerForm = new clima();
    document.body.appendChild(myCustomerForm);
}
window.onload = main;
</script>
</html>
