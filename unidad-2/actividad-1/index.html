<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
</body>
<script>

class CalcuModel extends EventTarget{
    constructor(){
        super();
           this.expresion = "";
    }

    agregar(valor) {
        this.expresion += valor;
    }

    borrar() {
        this.expresion = "";
    }

    calcular() {
        return eval(this.expresion);
    }

    getExpresion() {
        return this.expresion;
    }

    setExpresion(valor) {
        this.expresion = valor;
    }
}

class CalcuController{
    constructor(model, view){
        this.model = model;
        this.view = view;
        
        this.iniciar();
    }
    iniciar(){
        this.view.addEventListener("entrada", this.recibirEntrada.bind(this));
    }

    recibirEntrada(e){
        var valor = e.detail;
        if(valor == "="){
        this.calcular();
    }
    else if(valor == "BORRAR"){
        this.borrar();
    }
    else{
        this.model.agregar(valor);
        this.view.show(this.model.getExpresion());
    }
    }

    calcular(){
        var resultado = this.model.calcular();
        this.model.setExpresion(resultado);
        this.view.show(resultado);
    }

    borrar(){
        this.model.borrar();
        this.view.show("");
    }

}

class CalcuView extends HTMLElement{
    constructor(){
        super();
         this.expresion = "";
        //definir botones y el contenedor

        this.contenedor.style.gap = "5px";
        this.display.style.width = "100%";
        this.display.style.height = "40px";
        this.display.style.fontSize = "20px";
        this.style.width = "250px";

        this.btn2.style.borderRadius = "12px";
        this.btn3.style.backgroundColor = "#4a90e2";
        this.btn3.style.color = "white";
        this.btn3.style.borderRadius = "12px";
        this.btn4.style.backgroundColor = "#4a90e2";
        this.btn4.style.color = "white";
        this.btn4.style.borderRadius = "12px";
        this.btn5.style.backgroundColor = "#4a90e2";
        this.btn5.style.color = "white";
        this.btn5.style.borderRadius = "12px";
        this.btn6.style.backgroundColor = "#4a90e2";
        this.btn6.style.color = "white";

        this.btn7.style.backgroundColor = "#4a90e2";

        this.btn9.style.backgroundColor = "#4a90e2";

        this.btndivi.style.backgroundColor = "#7ed957";
        this.btndivi.style.color = "white";
        this.btndivi.style.borderRadius = "12px";

        this.btnpunt.style.borderRadius = "12px";
        this.btnresult.style.backgroundColor = "#ffd966";
        this.btnresult.style.color = "white";

        this.btnborrar.style.backgroundColor = "#ff6b6b";
        this.btnborrar.style.color = "white";
        this.btnborrar.style.fontSize = "18px";
        this.btnborrar.style.textAlign = "center";
        this.btnborrar.style.gridColumn = "span 4";
    }

    connectedCallback(){
        this.btn0.onclick = this.manejador.bind(this); 
        this.btn1.onclick = this.manejador.bind(this); 
        this.btn2.onclick = this.manejador.bind(this); 
        this.btn3.onclick = this.manejador.bind(this); 
        this.btn4.onclick = this.manejador.bind(this); 
        this.btn5.onclick = this.manejador.bind(this); 
        this.btn6.onclick = this.manejador.bind(this); 
        this.btn7.onclick = this.manejador.bind(this); 
        this.btn8.onclick = this.manejador.bind(this); 
        this.btn9.onclick = this.manejador.bind(this); 
        this.btnsum.onclick = this.manejador.bind(this); 
        this.btnrest.onclick = this.manejador.bind(this); 
        this.btndivi.onclick = this.manejador.bind(this); 
        this.btnmulti.onclick = this.manejador.bind(this); 
        this.btnresult.onclick = this.manejador.bind(this); 
        this.btnpunt.onclick = this.manejador.bind(this); 
        this.btnborrar.onclick = this.manejador.bind(this); 
    }

    manejador(event){
        var valor = event.target.innerText;
        this.dispatchEvent(new CustomEvent("entrada", {detail: valor}));
    }

    show(valor) {
        this.display.value = valor;
    }
}

customElements.define('x-calcu-view', CalcuView);

function main(){
    var model = new CalcuModel();
    var view = new CalcuView();
    document.body.appendChild(view);
    var controller = new CalcuController(model, view);
}
window.onload = main;
</script>
