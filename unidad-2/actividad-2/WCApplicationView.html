<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test WCApplicationView</title>
    
    <!-- CSS desde CDN -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    
</head>
<body class="w3-light-grey">
    
    <input id="sidebar-control" type="checkbox" class="w3-hide">
    
    <wc-application-view></wc-application-view>
</body>
<script>
function createIcon(classes) {
    var icon = document.createElement("i");
    if (classes && classes.length > 0) {
        icon.classList.add.apply(icon.classList, classes);
    }
    return icon;
}

function createLink(href, iconClasses, text) {
    var link = document.createElement("a");
    link.classList.add("w3-bar-item", "w3-button", "w3-padding-large", "w3-hover-text-primary");
    link.href = href;
    link.appendChild(createIcon(iconClasses));
    link.appendChild(document.createTextNode(" " + text + " "));
    return link;
}

function createButton(iconClasses, buttonClasses) {
    var button = document.createElement("button");
    button.type = "button";
    if (buttonClasses) {
        button.classList.add.apply(button.classList, buttonClasses);
    } else {
        button.classList.add("w3-button", "w3-large", "w3-opacity-min");
    }
    button.appendChild(createIcon(iconClasses));
    return button;
}

function createLabel(text, extraClasses) {
    var label = document.createElement("span");
    label.classList.add("w3-bar-item", "w3-padding", "w3-small", "w3-opacity");
    if (extraClasses) {
        label.classList.add.apply(label.classList, extraClasses);
    }
    label.appendChild(document.createTextNode(" " + text + " "));
    return label;
}

function createNavbar() {
    // 1. Crear elementos
    var navbar = document.createElement("div");
    var bar = document.createElement("div");
    var logoContainer = document.createElement("div");
    var title = document.createElement("h5");
    var link = document.createElement("a");
    var logo = document.createElement("img");
    var logoText = document.createTextNode(" W3Admin");
    var sidebarButton = document.createElement("label");
    var menuIcon = createIcon(["fa", "fa-bars"]);
    var rightContainer = document.createElement("div");
    var messageButton = createButton(["fa", "fa-envelope-open"]);
    var notificationButton = createButton(["fa", "fa-bell"]);
    var profileContainer = document.createElement("div");
    var profileButton = document.createElement("div");
    var profileCircle = document.createElement("div");
    var profileIcon = createIcon(["fa", "fa-fw", "fa-user"]);

    // 2. Asignar clases
    navbar.classList.add("w3-top", "w3-card");
    bar.classList.add("w3-flex-bar", "w3-theme", "w3-left-align");
    logoContainer.classList.add("admin-logo", "w3-bar-item", "w3-hide-medium", "w3-hide-small");
    link.classList.add("w3-button", "w3-bold");
    logo.classList.add("w3-image");
    sidebarButton.classList.add("w3-button", "w3-large", "w3-opacity-min", "js-sidebar-toggle"); // Clase para identificar el botón
    rightContainer.classList.add("w3-right");
    profileContainer.classList.add("text-right");
    profileButton.classList.add("w3-button");
    profileCircle.classList.add("w3-circle", "w3-center", "w3-text-white", "w3-primary");

    // 3. Asignar estilos
    bar.style.display = "flex";
    bar.style.justifyContent = "space-between";
    bar.style.alignItems = "center";
    bar.style.padding = "0 10px";
    rightContainer.style.marginRight = "10px";
    navbar.style.height = "54px";
    title.style.lineHeight = "1";
    title.style.margin = "0";
    title.style.fontWeight = "300";
    logo.style.width = "26px";
    profileCircle.style.width = "38px";
    profileCircle.style.height = "38px";
    profileIcon.style.marginTop = "11px";

    // 4. Asignar atributos
    link.href = "./index.html";
    logo.src = "./assets/admin-logo.png";
    logo.alt = "W3Admin";
    sidebarButton.htmlFor = "sidebar-control";

    // 5. Ensamblar
    link.appendChild(logo);
    link.appendChild(logoText);
    title.appendChild(link);
    logoContainer.appendChild(title);

    sidebarButton.appendChild(menuIcon);

    rightContainer.appendChild(messageButton);
    rightContainer.appendChild(notificationButton);

    profileCircle.appendChild(profileIcon);
    profileButton.appendChild(profileCircle);
    profileContainer.appendChild(profileButton);

    bar.appendChild(logoContainer);
    bar.appendChild(sidebarButton);
    bar.appendChild(rightContainer);
    bar.appendChild(profileContainer);

    navbar.appendChild(bar);

    // 6. Retornar
    return navbar;
}

function createSidebar() {
    var sidebar = document.createElement("nav");
    var mobileHeader = document.createElement("div");
    var mobileMenuButton = document.createElement("label");
    var mobileMenuIcon = createIcon(["fa", "fa-bars"]);
    var mobileLogoContainer = document.createElement("h5");
    var mobileLogoLink = document.createElement("a");
    var mobileLogo = document.createElement("img");
    var mobileLogoText = document.createTextNode(" W3Admin");
    var menuContainer = document.createElement("div");

    var mainNavLabel = createLabel("MAIN NAVIGATION");
    var dashboardLink = createLink("./index.html", ["fa", "fa-fw", "fa-bar-chart"], "listas");
    var iconsLink = createLink("./icons.html", ["fa", "fa-fw", "fa-fire"], "endpoints");
    var formsLink = createLink("./forms.html", ["fa", "fa-fw", "fa-edit"], "usuarios");
    var tablesLink = createLink("./tables.html", ["fa", "fa-fw", "fa-table"], "grupos");
    var profileLink = createLink("./profile.html", ["fa", "fa-fw", "fa-user-circle"], "Perfil");
    var loginLink = createLink("./login.html", ["fa", "fa-fw", "fa-lock"], "Login");
    var registerLink = createLink("./register.html", ["fa", "fa-fw", "fa-sign-in"], "Registrarse");

    var labelsLabel = createLabel("LABELS");
    var importantLink = createLink("#dashboard", ["fa", "fa-fw", "fa-coffee", "w3-text-danger"], "Important");
    var warningLink = createLink("#dashboard", ["fa", "fa-fw", "fa-circle-o-notch", "w3-text-success"], "Warning");
    var infoLink = createLink("#dashboard", ["fa", "fa-fw", "fa-share-alt", "w3-text-info"], "Information");

    sidebar.classList.add("w3-sidebar", "w3-top", "w3-bottom", "w3-collapse", "w3-white", "w3-border-right", "w3-border-top", "scrollbar");
    mobileHeader.classList.add("w3-bar-item", "w3-border-bottom", "w3-hide-large");
    mobileMenuButton.classList.add("w3-left", "w3-button", "w3-large", "w3-opacity-min");
    mobileLogoLink.classList.add("w3-button");
    mobileLogo.classList.add("w3-image");
    menuContainer.classList.add("w3-bar-block");

    sidebar.style.zIndex = "3";
    sidebar.style.width = "230px";
    sidebar.style.height = "auto";
    sidebar.style.marginTop = "54px";
    sidebar.style.borderColor = "rgba(0, 0, 0, .1)";
    mobileHeader.style.padding = "6px 0";
    mobileMenuButton.style.background = "white";
    mobileLogoLink.style.background = "white";
    mobileLogoContainer.style.lineHeight = "1";
    mobileLogoContainer.style.margin = "0";
    mobileLogoContainer.style.fontWeight = "300";
    mainNavLabel.style.marginTop = "8px";

    sidebar.id = "sidebar";
    mobileMenuButton.htmlFor = "sidebar-control";
    mobileLogoLink.href = "./index.html";
    mobileLogo.src = "./assets/admin-logo.png";
    mobileLogo.alt = "w3mix";

    mobileMenuButton.appendChild(mobileMenuIcon);
    mobileLogoLink.appendChild(mobileLogo);
    mobileLogoLink.appendChild(mobileLogoText);
    mobileLogoContainer.appendChild(mobileLogoLink);
    mobileHeader.appendChild(mobileMenuButton);
    mobileHeader.appendChild(mobileLogoContainer);

    menuContainer.appendChild(mainNavLabel);
    menuContainer.appendChild(dashboardLink);
    menuContainer.appendChild(iconsLink);
    menuContainer.appendChild(formsLink);
    menuContainer.appendChild(tablesLink);
    menuContainer.appendChild(profileLink);
    menuContainer.appendChild(loginLink);
    menuContainer.appendChild(registerLink);
    menuContainer.appendChild(labelsLabel);
    menuContainer.appendChild(importantLink);
    menuContainer.appendChild(warningLink);
    menuContainer.appendChild(infoLink);

    sidebar.appendChild(mobileHeader);
    sidebar.appendChild(menuContainer);

    return sidebar;
}

function createContent() {
    var main = document.createElement("div");
    var contentWrapper = document.createElement("div");

    main.classList.add("w3-main");
    contentWrapper.classList.add("w3-container");

    main.style.marginTop = "54px";
    contentWrapper.style.padding = "16px 32px";
    contentWrapper.style.minHeight = "calc(100vh - 104px)";

    main.appendChild(contentWrapper);
    return main;
}

function createFooter() {
    var footer = document.createElement("footer");
    var textSpan = document.createElement("span");
    var heartSpan = document.createElement("span");
    var link = document.createElement("a");
    var strong = document.createElement("strong");

    footer.classList.add("w3-padding", "w3-border-top", "w3-center", "w3-white", "w3-margin-top");
    textSpan.classList.add("w3-opacity");
    heartSpan.classList.add("w3-text-red");

    link.href = "https://w3mix.com";
    link.target = "_blank";

    strong.appendChild(document.createTextNode("W3Mix.com"));
    link.appendChild(strong);
    heartSpan.appendChild(document.createTextNode("♥"));

    textSpan.appendChild(document.createTextNode("Powered with "));
    textSpan.appendChild(heartSpan);
    textSpan.appendChild(document.createTextNode(" by "));
    textSpan.appendChild(link);
    textSpan.appendChild(document.createTextNode("."));

    footer.appendChild(textSpan);
    return footer;
}

class WCApplicationView extends HTMLElement {
    constructor() {
        super();
        this.navbar = createNavbar();
        this.sidebar = createSidebar();
        this.content = createContent();
        this.footer = createFooter();
        
        
        this.appendChild(this.navbar);
        this.appendChild(this.sidebar);
        this.appendChild(this.content);
        this.appendChild(this.footer);
        // Referencia al botón que dispara el evento
        this.toggleBtn = this.navbar.querySelector(".js-sidebar-toggle");
        this._boundToggleHandler = null;
    }

    connectedCallback() {
        this._boundToggleHandler = this.handleSidebarToggle.bind(this);
        if (this.toggleBtn) {
            this.toggleBtn.addEventListener("click", this._boundToggleHandler);
        }
    }

    disconnectedCallback() {
        if (this.toggleBtn && this._boundToggleHandler) {
            this.toggleBtn.removeEventListener("click", this._boundToggleHandler);
            this._boundToggleHandler = null;
        }
    }

    handleSidebarToggle(event) {
        this.sidebar.classList.toggle("w3-show");
    }
}

customElements.define("wc-application-view", WCApplicationView);
</script>
</html>
